[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pii-shield"
version = "1.0.0"
description = "India-aware, in-memory PII detection, placeholder redaction, and reply restoration."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["pii", "redaction", "india", "aadhaar", "pan", "upi", "passport", "ner", "privacy", "fastapi"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.urls]
Homepage = "https://pii-shield-ql5licjz5a-uc.a.run.app"
BackupDemo = "https://bhavihalshivu--pii-shield-web-app.us-east.modal.run"
Repository = "https://github.com/shivangoudapb/pii-shield"
Issues = "https://github.com/shivangoudapb/pii-shield/issues"

[project.optional-dependencies]
ner = [
    "torch==2.11.0",
    "transformers==4.57.3",
    "gliner==0.2.30",
    "protobuf==7.36.2",
]
api = [
    "fastapi==0.115.6",
    "pydantic==2.10.4",
    "uvicorn==0.34.0",
]
dev = [
    "pytest==8.3.4",
    "httpx==0.28.1",
]

[tool.setuptools]
packages = ["pii_shield", "engine"]
py-modules = ["redactor"]
